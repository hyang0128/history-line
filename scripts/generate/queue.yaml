  dynasty: liao
  year: 916
  importance: 4
  hint: 耶律阿保机统一契丹八部，916年称帝建契丹国，创契丹文字、立班烈制度，后改国号辽；说明其“蕃汉分治”的南北面官制。
- id: xixia-founding
  type: event
  title: 西夏建国
  era: song-liao-jin-yuan
  dynasty: western-xia
  year: 1038
  importance: 3
  hint: 党项李元昊 1038 年称帝建夏，创西夏文，与宋辽长期三国并立；说明其兴庆府（银川）政权与宋的和平榷场贸易、战争关系。
- id: jin-founding
  type: event
  title: 金朝建立
  era: song-liao-jin-yuan
  dynasty: jin
  year: 1115
  importance: 4
  hint: 女真完颜阿骨打于1115年称帝建国号金，创猛安谋克制，反辽与灭辽灭北宋；说明女真崛起与猛安谋克军制的能量。
- id: jin-destroy-liao
  type: event
  title: 金灭辽
  era: song-liao-jin-yuan
  dynasty: jin
  year: 1125
  importance: 3
  hint: 金联合北宋夹攻辽，1125年俘辽天祚帝，辽国（含西辽余绪）灭亡；说明“海上之盟”夹击辽的后果与金随即攻宋的开启。
- id: mongol-destroy-xixia-jin
  type: event
  title: 蒙古灭西夏与金
  era: song-liao-jin-yuan
  dynasty: jin
  year: 1227
  yearEnd: 1234
  importance: 4
  hint: 成吉思汗 1227 年灭西夏（同年崩），窝阔台于 1234 年灭金，金哀宗楚州自缢；说明蒙古两翼夹击、借道南宋与金亡后宋蒙冲突的开始。

# —— 事件 · 元 ——
- id: mongol-empire-founding

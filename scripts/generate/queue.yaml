  hint: 董仲舒对策主张以儒家思想统一教化，武帝据以立五经博士、重文学，儒学确立为官方意识形态；说明其制度背景（郡国并行、黄老无为转向有为）。
- id: zhangqian-western-regions
  type: event
  title: 张骞出使西域
  era: qin-han
  dynasty: western-han
  year: -138
  yearEnd: -126
  importance: 4
  hint: 为联合大月氏夹击匈奴，张骞两度出使，一度被匈奴扣留十余年，归来报告西域各国形势，开辟“凿空”之路；说明其对丝绸之路开通与汉与乌孙等结盟的意义。
- id: han-xiongnu-war
  type: event
  title: 汉击匈奴与漠北决战
  era: qin-han
  dynasty: western-han
  year: -127
  yearEnd: -119
  importance: 4
  hint: 武帝时对匈奴大规模用兵：河南之战、河西之战与漠北决战，卫青、霍去病直抵漠北，匈奴远遁，“漠南无王庭”；说明战争代价与匈奴南附、张骞路线的关系。
- id: wangmang-usurpation
  type: event
  title: 王莽篡汉
  era: qin-han
  dynasty: xin
  year: 9
  yearEnd: 23
  importance: 4
  hint: 外戚王莽以外戚政治、符命禅让方式于9年建立新朝，推行王田制、五均六筦等托古改制，改制失败、社会动荡，赤眉绿林起事后被杀，新朝灭亡。
- id: lulin-chimei-uprising
  type: event
  title: 绿林赤眉起义
  era: qin-han
  dynasty: xin
  year: 17
  yearEnd: 27
  importance: 3
  hint: 王莽末年饥荒中绿林（新市、平林）、赤眉相继起事，23年昆阳之战刘秀以少胜多，绿林军入长安推翻新朝；说明民变如何终结新莽并开启东汉。
- id: guangwu-restoration
  type: event
  title: 光武中兴
  era: qin-han
  dynasty: eastern-han
  year: 25
  yearEnd: 57
  importance: 4
  hint: 刘秀借昆阳之战与河北经营起家，25年称帝即光武帝，灭赤眉与割据群雄统一天下；推行度田、轻徭薄赋、表彰气节，史称“光武中兴”。
- id: banchao-western-regions
  type: event
  title: 班超通西域
  era: qin-han
  dynasty: eastern-han
  year: 73
  yearEnd: 102
  importance: 3
  hint: 班超以三十六人随耿秉北征后留驻西域，先后服鄯善、于阗、疏勒，平定焉耆，重设西域都护，经营三十余年；说明东汉对西域的经略与“不入虎穴焉得虎子”。
- id: dangguzhihuo
  type: event
  title: 党锢之祸
  era: qin-han
  dynasty: eastern-han
  year: 166
  yearEnd: 184
  importance: 3
  hint: 桓灵之际宦官把持朝政，清议士人李膺、范滂等抨击权宦，两次遭“党锢”禁锢，酿成士人与宦官的对立；说明党锢与东汉末年政治危机的关系。
- id: huangjin-uprising
  type: event
  title: 黄巾起义
  era: qin-han
  dynasty: eastern-han
  year: 184
  importance: 4
  hint: 太平道张角以“苍天已死，黄天当立”号召，184年八州并起，东汉朝廷放权州牧、各地豪强募兵镇压；说明其动摇汉室、开启军阀割据的转折意义。
- id: dongzhuo-disorder
  type: event
  title: 董卓之乱与挟天子
  era: qin-han
  dynasty: eastern-han
  year: 189
  yearEnd: 192
  importance: 4
  hint: 何进谋诛宦官反被杀，董卓进京废少帝立献帝、专断朝政，关东诸侯讨董，董卓焚洛阳迁都长安，后为王允吕布所杀；说明汉室威权扫地与群雄割据的开始。

# —— 人物 ——
- id: qin-shi-huang
  type: person
  title: 秦始皇
  era: qin-han
  dynasty: qin
  year: -259
  yearEnd: -210
  importance: 5
  hint: 名嬴政，秦庄襄王之子，前246年即位，前221年并吞六国称始皇帝；统一文字货币度量衡、行郡县、筑长城，五次巡行与求仙，前210年病崩沙丘；关注其功业与苛政并存的评价。
- id: li-si
  type: person
  title: 李斯
  era: qin-han
  dynasty: qin
  year: -284
  yearEnd: -208
  importance: 3
  hint: 楚国上蔡人，荀子门徒，秦统一功臣、丞相；主张废分封行郡县，上书《谏逐客书》，议定焚书之策，后被赵高矫诏腰斩于市。
- id: xiang-yu
  type: person
  title: 项羽
  era: qin-han
  dynasty: qin
  year: -232
  yearEnd: -202
  importance: 4
  hint: 名籍，字羽，楚将项燕之后，巨鹿之战破秦军主力，自立西楚霸王；楚汉相争四年，垓下兵败自刎乌江；注意写其军事才能与不善用人的两面。
- id: liu-bang
  type: person
  title: 刘邦
  era: qin-han
  dynasty: western-han
  year: -256
  yearEnd: -195
  importance: 5
  hint: 汉高祖，沛县亭长起兵，先入关中、约法三章，楚汉相争获胜，前202年称帝；郡国并行、休养生息、轻徭薄赋；说明“布衣天子”与其驭人之术。
- id: han-wudi
  type: person
  title: 刘彻
  era: qin-han
  dynasty: western-han
  year: -156
  yearEnd: -87
  importance: 5
  hint: 汉武帝，年号汉武帝；弱冠即位，推恩令削藩、独尊儒术、盐铁官营、北击匈奴通西域，武功文治并盛；晚年巫蛊之祸与轮台诏，写其功过对读。
- id: zhang-qian
  type: person
  title: 张骞
  era: qin-han
  dynasty: western-han
  year: -164
  yearEnd: -114
  importance: 4
  hint: 汉中成固人，奉诏两使西域，欲联合大月氏击匈奴，被匈奴扣留十余年仍持节不屈，归来封博望侯；其行程报告促使丝绸之路开通，为“凿空者”；生年约前164（一说前175）。
- id: huo-qubing
  type: person
  title: 霍去病
  era: qin-han
  dynasty: western-han
  year: -140
  yearEnd: -117
  importance: 3
  hint: 卫青外甥，汉武时骠骑将军，河西之战、漠北决战以战法迅疾取胜，封冠军侯；一句“匈奴未灭，何以家为”流传后世；年仅二十四岁病卒。
- id: si-ma-qian
  type: person
  title: 司马迁
  era: qin-han
  dynasty: western-han
  year: -145
  yearEnd: -86
  importance: 4
  hint: 太史令，继父谈之志著《史记》，因李陵之祸受宫刑，发愤著书五十余万字、纪传体通史；生卒约前145—约前86；说明《史记》的体例开创与“实录”精神。
- id: wang-mang
  type: person
  title: 王莽
  era: qin-han
  dynasty: xin
  year: -45
  yearEnd: 23
  importance: 4
  hint: 西汉末外戚，谦恭饰节而上台，9年废汉建“新”，托古改制的王田、币制、五均六筦均告失败，民变蜂起，23年被杀；说明其形象与“篡汉”评价的流变。
- id: guangwu-di
  type: person
  title: 刘秀
  era: qin-han
  dynasty: eastern-han
  year: -5
  yearEnd: 57
  importance: 4
  hint: 汉光武帝，昆阳之战以少胜多，绿林军中崛起，25年称帝定都洛阳，灭群雄统一天下；度田、轻徭薄赋、偃武修文，史称“光武中兴”。
- id: ban-chao
  type: person
  title: 班超
  era: qin-han
  dynasty: eastern-han
  year: 32
  yearEnd: 102
  importance: 3
  hint: 班彪之子、班固之弟，投笔从戎，以三十六人深入西域三十余年，服鄯善于阗疏勒等，重设西域都护，封定远侯；说明其“以夷制夷”的经略。
- id: cai-lun
  type: person
  title: 蔡伦
  era: qin-han
  dynasty: eastern-han
  year: 63
  yearEnd: 121
  importance: 3
  hint: 东汉宦官，尚方令，改进造纸术，元兴元年（105年）献纸，后世称“蔡侯纸”，造纸术由此推广并外传；说明其改进并非单纯“发明”及其世界意义。
- id: zhang-heng
  type: person
  title: 张衡
  era: qin-han
  dynasty: eastern-han
  year: 78
  yearEnd: 139
  importance: 3
  hint: 南阳西鄂人，天文学家、文学家，创制浑天仪与候风地动仪，著《张河间集》及《二京赋》《归田赋》；说明其在中国科技史与文学史的双重地位。

# —— 专题（跨朝代放 topics/ 根下）——
- id: junxian-zhi
  type: topic
  title: 郡县制
  era: qin-han
  year: -221
  yearEnd: 220
  importance: 4
  hint: 秦始皇废分封行郡县、设郡守县令直隶中央，汉因之而郡国并行，此后一直沿用到清；说明其与宗法分封之别及“百代都行秦政法”的制度意义。
- id: chaju-zhi
  type: topic
  title: 察举制
  era: qin-han
  year: -196
  yearEnd: 220
  importance: 3
  hint: 汉代选官制度：以孝廉、茂才、贤良方正等科目由地方察举、朝廷考试任用，至东汉形成门阀化；说明其与察举征辟、九品中正制的承递关系。
- id: silk-road
  type: topic
  title: 丝绸之路
  era: qin-han
  year: -138
  yearEnd: 907
  importance: 4
  hint: 张骞凿空后形成的连接汉唐与中亚、西亚、地中海贸易通道，丝绸、香料、佛教与物产交流；说明其路线变化、官方经营（西域都护/安西）与后来海上丝路的此消彼长。

# —— 世界史对照（region 必填）——
- id: roma-punic-wars
  type: world
  title: 布匿战争
  era: qin-han
  year: -264
  yearEnd: -146
  importance: 3
  region: 罗马
  hint: 罗马与迦太基争夺西地中海的三次大战，汉尼拔翻越阿尔卑斯山，最终迦太基灭亡，罗马称霸地中海；与秦并六国、汉击匈奴大致同时；只需一段白话概述。
- id: caesar-republic-fall
  type: world
  title: 凯撒与罗马共和国之亡
  era: qin-han
  year: -49
  yearEnd: -27
  importance: 3
  region: 罗马
  hint: 凯撒渡卢比孔河、独裁与遇刺，渥大维（奥古斯都）建立元首制，共和国转为帝国；与汉昭宣、光武中兴同期；只需一段白话概述。
- id: parthia-empire
  type: world
  title: 帕提亚（安息）帝国
  era: qin-han
  year: -247
  yearEnd: 224
  importance: 2
  region: 波斯
  hint: 伊朗高原兴起的帕提亚（中国史书称安息），与罗马长期争雄，丝绸之路上的重要中转；对应秦汉时期；只需一段白话概述。
- id: kushan-empire
  type: world
  title: 贵霜帝国
  era: qin-han
  year: 30
  yearEnd: 375
  importance: 2
  region: 中亚
  hint: 大月氏后裔所建贵霜，统治中亚与北印度，佛教艺术（犍陀罗）繁盛，是汉与西域间的重要文明；只需一段白话概述。
- id: japan-yayoi
  type: world
  title: 日本弥生时代
  era: qin-han
  year: -300
  yearEnd: 300
  importance: 2
  region: 日本
  hint: 朝鲜半岛文化与水稻传入日本，弥生文化兴起，邪马台国见于《三国志》；“倭人”与中国史书互见；只需一段白话概述。


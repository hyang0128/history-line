# C3 三国两晋南北朝批次（era: wei-jin-nanbei）
# ============================================================

# —— 事件 · 三国 ——
- id: guandu-battle
  type: event
  title: 官渡之战
  era: wei-jin-nanbei
  dynasty: three-kingdoms
  year: 200
  importance: 4
  hint: 建安五年，曹操与袁绍决战于官渡，以少胜多，为统一北方奠定基础；说明双方形势、奇袭乌巢的关键与袁绍败亡。
- id: chibi-battle
  type: event
  title: 赤壁之战
  era: wei-jin-nanbei
  dynasty: three-kingdoms
  year: 208
  importance: 5
  hint: 建安十三年，孙刘联军在赤壁大破曹操水军，曹操退回北方，奠定三国鼎立格局；说明曹操南征、火攻与瘟疫、疫病等细节及其后世叙事的演义化。
- id: caopi-usurpation
  type: event
  title: 曹丕代汉
  era: wei-jin-nanbei
  dynasty: three-kingdoms
  year: 220
  importance: 4
  hint: 建安二十五年曹操卒、曹丕嗣魏王，逼汉献帝禅位，建立魏朝；说明“禅让”传统与汉亡、三国并立的正式开端。
- id: yiling-battle
  type: event
  title: 夷陵之战
  era: wei-jin-nanbei
  dynasty: three-kingdoms
  year: 222
  importance: 3
  hint: 蜀汉为报关羽之仇伐吴，陆逊以逸待劳火烧连营，刘备兵败白帝城；说明蜀吴同盟的破裂与恢复，及三国均势的维持。
- id: gaopingling-coup
  type: event
  title: 高平陵之变
  era: wei-jin-nanbei
  dynasty: three-kingdoms
  year: 249
  importance: 4
  hint: 司马懿趁曹爽随帝谒高平陵发难，诛曹爽集团，独揽魏政；说明司马氏夺权的关键一步与魏晋禅代的前奏。
- id: jin-unification
  type: event
  title: 三国归晋
  era: wei-jin-nanbei
  dynasty: western-jin
  year: 263
  yearEnd: 280
  importance: 4
  hint: 263年魏灭蜀，265年司马炎代魏建晋，280年晋灭吴统一全国；说明三国结束的过程与短暂统一的隐患（八王之乱伏笔）。

# —— 事件 · 两晋十六国 ——
- id: ba-wang-zhi-luan
  type: event
  title: 八王之乱
  era: wei-jin-nanbei
  dynasty: western-jin
  year: 291
  yearEnd: 306
  importance: 4
  hint: 晋惠帝时宗室诸王拥兵互攻，战乱十余年，北方军力涣散、五胡乘隙而起；说明其与西晋速亡及永嘉之乱的关系。
- id: yongjia-disaster
  type: event
  title: 永嘉之乱与衣冠南渡
  era: wei-jin-nanbei
  dynasty: western-jin
  year: 311
  importance: 4
  hint: 永嘉五年，刘曜攻破洛阳俘晋怀帝，衣冠南渡，次年愍帝在长安被俘、西晋亡；说明中原士族南迁与东晋立国的开端。
- id: feishui-battle
  type: event
  title: 淝水之战
  era: wei-jin-nanbei
  dynasty: eastern-jin
  year: 383
  importance: 5
  hint: 前秦苻坚率八十万大军南征，谢玄率北府兵于淝水以少胜多，苻坚败亡、前秦瓦解；说明“风声鹤唳草木皆兵”与北方再度分裂。
- id: liu-yu-song
  type: event
  title: 刘裕代晋（刘宋建立）
  era: wei-jin-nanbei
  dynasty: southern-dynasties
  year: 420
  importance: 4
  hint: 东晋末年刘裕北伐灭南燕后突厥、屡建战功，420年逼晋恭帝禅位，建立刘宋，南朝与北朝对峙格局成形。

# —— 事件 · 南北朝 ——
- id: beiwei-unification
  type: event
  title: 北魏统一北方
  era: wei-jin-nanbei
  dynasty: northern-dynasties
  year: 439
  importance: 4
  hint: 拓跋焘（太武帝）灭北凉，统一北方，结束十六国混战；说明北魏道武、明元、太武三朝的扩张与统一北方后的胡汉关系。
- id: beiwei-split
  type: event
  title: 北魏分裂（东魏西魏）
  era: wei-jin-nanbei
  dynasty: northern-dynasties
  year: 534
  importance: 3
  hint: 534年后魏孝武帝西奔宇文泰，高欢另立孝静帝，北魏分为东魏西魏，各由高氏、宇文氏控制，后演变为北齐北周。
- id: xiaowen-reform
  type: event
  title: 孝文帝迁都洛阳与汉化改革
  era: wei-jin-nanbei
  dynasty: northern-dynasties
  year: 493
  yearEnd: 499
  importance: 5
  hint: 冯太后与孝文帝推行的均田制、三长制、俸禄制，及493年迁都洛阳、改胡服习华语通婚改姓等全面汉化；说明其意义与北镇军人反对的伏笔。
- id: houjing-rebellion
  type: event
  title: 侯景之乱
  era: wei-jin-nanbei
  dynasty: southern-dynasties
  year: 548
  yearEnd: 552
  importance: 4
  hint: 东魏叛将侯景降梁又反，548年围建康、饿死梁武帝，梁室诸王内讧，江南残破；说明其加速门阀江南的衰落与陈朝建立的背景。

# —— 人物 ——
- id: cao-cao
  type: person
  title: 曹操
  era: wei-jin-nanbei
  dynasty: three-kingdoms
  year: 155
  yearEnd: 220
  importance: 5
  hint: 魏武帝，字孟德；讨董卓、挟天子、屯田、破袁绍统一北方，论《碣石篇》《龟虽寿》；说明其治世能臣与乱世奸雄的形象流变，及与《三国演义》的关系。
- id: liu-bei
  type: person
  title: 刘备
  era: wei-jin-nanbei
  dynasty: three-kingdoms
  year: 161
  yearEnd: 223
  importance: 4
  hint: 蜀汉昭烈帝，字玄德；从织席贩履到取益州建蜀、白帝托孤；说明其以“仁德”为号召的形象与《三国演义》的塑造。
- id: sun-quan
  type: person
  title: 孙权

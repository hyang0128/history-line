- id: xing-sheng-zhi
  type: topic
  title: 行省制度
  era: song-liao-jin-yuan
  year: 1271
  yearEnd: 1368
  importance: 4
  hint: 元朝不设三省的中央地方制度，中枢宰相兼领地方行中书省，行省成为地方最高政区，明承其制；说明其对中国地方行政“省”的奠基意义。


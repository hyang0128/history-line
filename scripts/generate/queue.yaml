- id: kaixi-beifa
  type: event
  title: 开禧北伐
  era: song-liao-jin-yuan
  dynasty: southern-song
  year: 1206
  yearEnd: 1208
  importance: 3
  hint: 韩侂胄主持的抗金北伐，仓促发动、西蜀吴曦叛变，宋军溃败，嘉定和议增岁币、诛侂胄函首送金；说明南宋最后一次主动北伐的教训。
- id: duanping-ru-luo
  type: event
  title: 端平入洛
  era: song-liao-jin-yuan
  dynasty: southern-song
  year: 1234
  importance: 3
  hint: 宋蒙联合灭金后，南宋乘隙收复三京，蒙古随即南下，端平入洛之败成为蒙古灭宋的导火索；说明南宋“借路灭金”的战略短视。
- id: xiangyang-southern-song-fall
  type: event
  title: 襄樊失守与南宋灭亡
  era: song-liao-jin-yuan
  dynasty: southern-song
  year: 1267
  yearEnd: 1279
  importance: 4
  hint: 蒙古围困襄阳六年（1273城破），伯颜东下攻破临安，1279年崖山海战陆秀夫负帝昺蹈海，南宋灭亡；说明这六年相持与崖山之战的“最后守御”。

# —— 事件 · 辽西夏金 ——
- id: liao-founding

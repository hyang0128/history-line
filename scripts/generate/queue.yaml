  title: 交子与纸币
  era: song-liao-jin-yuan
  year: 1023
  yearEnd: 1350
  importance: 3
  hint: 北宋初四川出现世界最早的纸币交子，官方收归为益州交子务，南宋会子、金交钞与元宝钞相继；说明商业繁荣与纸币滥发的教训。
- id: meng-an-mou-ke

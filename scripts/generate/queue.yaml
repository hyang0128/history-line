  importance: 4
  hint: 倭患猖獗于东南沿海，戚继光组建戚家军、练新阵（鸳鸯阵），台州大捷、破横屿牛田，浙闽倭患渐平；说明明代海防与募兵制的兴起。
- id: zhang-juzheng-reform
  type: event
  title: 张居正改革
  era: ming
  dynasty: ming
  year: 1573
  yearEnd: 1582
  importance: 5
  hint: 万历初年张居正任首辅，整顿吏治（考成法）、整顿社会治安、丈田清丈、推行一条鞭法；说明改革成效与其身后被抄家悲剧。
- id: wanli-donglin
  type: event
  title: 万历怠政与东林党议
  era: ming
  dynasty: ming
  year: 1594
  yearEnd: 1620
  importance: 3
  hint: 万历中后期皇帝怠政、税监四处，顾宪成等讲学东林书院评议朝政，党争加剧（“争国本”“三案”）；说明明末党争与官僚体制崩溃的伏笔。
- id: sarhu-battle
  type: event
  title: 萨尔浒之战
  era: ming
  dynasty: ming
  year: 1619
  importance: 4
  hint: 明军四路合击后金，努尔哈赤采取“凭尔几路来，我只一路去”集中击破，三路败灭；说明辽东攻守形势逆转与后金崛起的关键一战。
- id: ming-fall
  type: event
  title: 明末农民军破京师
  era: ming
  dynasty: ming
  year: 1644
  importance: 5
  hint: 崇祯十七年李自成大顺军攻克北京，崇祯在煤山自缢，明朝灭亡；说明灾荒、加饷、三边空虚与农民战争的最终爆发，及吴三桂引清兵入关的后续一边。
- id: southern-ming
  type: event
  title: 南明
  era: ming
  dynasty: ming
  year: 1644
  yearEnd: 1662
  importance: 3
  hint: 明亡后在江南相继建弘光、隆武、永历等政权，郑成功据台湾抗清，1662年永历被吴三桂所杀；说明南明内讧与抗清力量瓦解的过程。

# —— 人物 ——
- id: zhu-yuanzhang
  type: person
  title: 朱元璋
  era: ming
  dynasty: ming
  year: 1328
  yearEnd: 1398
  importance: 5
  hint: 明太祖，濠州佃农出身，参加红巾军、吴王—皇帝；废丞相、兴大狱、重农桑，崇“祖训”而严刑峻法；说明布衣天子与洪武重典的争议。
- id: zhu-di
  type: person
  title: 朱棣
  era: ming
  dynasty: ming
  year: 1360
  yearEnd: 1424
  importance: 5
  hint: 明成祖，燕王起兵“靖难”夺位，永乐在位迁都北京、设内阁、命郑和下西洋、修《永乐大典》亲征漠北；说明夺嫡上位与永乐一朝功业的对照。
- id: zheng-he
  type: person
  title: 郑和
  era: ming
  dynasty: ming
  year: 1371
  yearEnd: 1433
  importance: 5
  hint: 姓马名和，三宝太监，云南回回，随朱棣靖难有功赐姓郑；七下西洋，最远东非；说明其航海壮举、随员记录（马欢《瀛涯胜览》）与后世意义。
- id: yu-qian
  type: person
  title: 于谦
  era: ming
  dynasty: ming
  year: 1398
  yearEnd: 1457
  importance: 4
  hint: 字廷益，钱塘人；土木堡后力主固守北京、拥立景帝，击退瓦剌；英宗复辟后被诛，平反昭雪；说明“粉骨碎身浑不怕”的忠节形象与悲剧。
- id: wang-shouren
  type: person
  title: 王守仁
  era: ming
  dynasty: ming
  year: 1472
  yearEnd: 1529
  importance: 5
  hint: 字伯安，号阳明子；心学集大成者，“致良知”“知行合一”，平宁王之乱；说明明代心学对程朱理学的反拨及其东亚影响。
- id: zhang-ju-zheng
  type: person
  title: 张居正
  era: ming
  dynasty: ming
  year: 1525
  yearEnd: 1582
  importance: 5
  hint: 字叔大，号太岳，隆庆万历间首辅，考成法、一条鞭法，执掌十年、国势稍振；死后遭籍，说明其集权改革与身后清算的矛盾。
- id: qi-ji-guang
  type: person
  title: 戚继光
  era: ming
  dynasty: ming
  year: 1528
  yearEnd: 1588
  importance: 4
  hint: 字元敬，号南塘；戚家军、鸳鸯阵，抗倭名将，后又御北虏修长城；著《纪效新书》《练兵实纪》；说明明中后期军事改革与将帅地位。
- id: hai-rui
  type: person
  title: 海瑞
  era: ming
  dynasty: ming
  year: 1514
  yearEnd: 1587
  importance: 3
  hint: 字汝贤，号刚峰，以廉直著称，上《治安疏》骂嘉靖“天下人不直陛下久矣”；说明清官形象与明代士风的侧面。
- id: li-zi-cheng
  type: person
  title: 李自成
  era: ming
  dynasty: ming
  year: 1606
  yearEnd: 1645
  importance: 4
  hint: 陕西米脂人，驿卒出身，闯王；大顺政权攻克北京推翻明朝，入关后被清军击败，1645年遇害；说明明末农民起义的高潮与运动局限。
- id: tang-xian-zu
  type: person
  title: 汤显祖
  era: ming
  dynasty: ming
  year: 1550
  yearEnd: 1616
  importance: 3
  hint: 字义仍，号若士；《牡丹亭》作者，“临川四梦”，情至论；说明明代戏曲文学的巅峰与其“情”的命题。
- id: xu-guang-qi
  type: person
  title: 徐光启
  era: ming
  dynasty: ming
  year: 1562
  yearEnd: 1633
  importance: 3
  hint: 字子先，号玄扈；与利玛窦合译《几何原本》，著《农政全书》，引进西学；说明明末中西文化会通的关键人物。
- id: yuan-chonghuan
  type: person
  title: 袁崇焕
  era: ming
  dynasty: ming
  year: 1584
  yearEnd: 1630
  importance: 4
  hint: 字元素，辽东督师，宁远大捷、宁锦大捷；抗清名将被崇祯凌迟处死，悲剧与反间计；说明明末辽东危局与君臣猜忌的惨烈。

# —— 专题——
- id: neige
  type: topic
  title: 内阁制度
  era: ming
  year: 1402
  yearEnd: 1644
  importance: 4
  hint: 从永乐设殿阁大学士到嘉靖后的首辅专权，内阁票拟、司礼监批红，皇权独裁下的行政中枢；说明内阁与宰相之别及其膨胀与掣肘。
- id: yi-tiao-bian-fa
  type: topic
  title: 一条鞭法
  era: ming
  year: 1567
  yearEnd: 1644
  importance: 4
  hint: 隆庆万历间推行按亩折银征派的赋役改革，一条鞭法合并差役赋税、计亩征银；说明其对土地兼并、白银货币化与地方财政的影响。
- id: chang-wei
  type: topic
  title: 厂卫制度
  era: ming
  year: 1382
  yearEnd: 1644
  importance: 3
  hint: 锦衣卫、东厂、西厂与内行厂构成的明代特务侦察体系，直隶皇帝、凌驾司法；说明明代监察失控与皇权专制的阴暗面。

# —— 世界史对照 ——
- id: age-of-exploration
  type: world
  title: 大航海时代
  era: ming
  year: 1492
  yearEnd: 1522
  importance: 5
  region: 欧洲
  hint: 哥伦布到达新大陆、达伽马到印度、麦哲伦环球，欧洲殖民扩张拉开序幕；与郑和下西洋恰可对照；只需一段白话概述。
- id: renaissance
  type: world
  title: 欧洲文艺复兴
  era: ming
  year: 1350
  yearEnd: 1600
  importance: 4
  region: 意大利
  hint: 但丁、达芬奇、米开朗琪罗等，人文主义思想勃发，奠定近代欧洲文化精神；对应明代；只需一段白话概述。
- id: constantinople-fall
  type: world
  title: 君士坦丁堡陷落
  era: ming
  year: 1453
  importance: 3
  region: 奥斯曼
  hint: 奥斯曼苏丹穆罕默德二世攻陷君士坦丁堡，拜占庭帝国灭亡，地中海局势与欧洲地理观随之大变；与土木堡之变同代；只需一段白话概述。
- id: reformation
  type: world
  title: 宗教改革
  era: ming
  year: 1517
  yearEnd: 1648
  importance: 3
  region: 欧洲
  hint: 马丁·路德九十五条论纲到三十年战争，教廷权威崩解，新教诸国并起；对应明嘉靖万历朝；只需一段白话概述。

# ============================================================
# C7 清代批次（era: qing；"分期即政权"，dynasty 填 qing）
# ============================================================

# —— 事件 ——
- id: qing-enter-guans
  type: event
  title: 清军入关与定鼎北京
  era: qing
  dynasty: qing
  year: 1644
  importance: 5
  hint: 顺治元年吴三桂引清兵入关击败大顺，清迁都北京，逐步统一全国；说明摄政王多尔衮、剃发令与南明抵抗的并存。
- id: kangxi-suppress-three-feudatories
  type: event
  title: 康熙平定三藩
  era: qing
  dynasty: qing
  year: 1673
  yearEnd: 1681
  importance: 4
  hint: 吴三桂、耿精忠、尚之信三藩叛乱，康熙力排众议用兵八年平定；说明三藩之乱对清初财政与集权的考验。
- id: taiwan-unify
  type: event
  title: 施琅平台与台湾统一
  era: qing
  dynasty: qing
  year: 1683
  importance: 4
  hint: 明郑政权（郑成功、郑经、郑克塽）割据台湾，康熙二十二年施琅率水师克台，郑氏降，台设一府三县；说明清对台经略的意义。
- id: kangxi-galdan
  type: event
  title: 康熙三征噶尔丹
  era: qing
  dynasty: qing
  year: 1690
  yearEnd: 1697
  importance: 4
  hint: 准噶尔部噶尔丹东掠喀尔喀、逼临漠南，康熙亲征，昭莫多败噶尔丹，漠北喀尔喀入清；说明清对准部问题与北方边防的长期经营。
- id: nerchinsk-treaty
  type: event
  title: 《尼布楚条约》
  era: qing
  dynasty: qing
  year: 1689
  importance: 3
  hint: 清俄划定东段边界、确立外交文书范式，雅克萨之战后签订；说明清代与欧洲国家最早的一项平等边界条约及其背景。
- id: yongzheng-junjichu
  type: event
  title: 雍正设军机处
  era: qing
  dynasty: qing
  year: 1729
  importance: 4
  hint: 雍正七年因西北用兵设军机处，掌机密要政，内阁形同虚设；说明清代皇权与行政中枢的制度演变。
- id: bai-lian-jiao-uprising
  type: event
  title: 白莲教起义
  era: qing
  dynasty: qing
  year: 1796
  yearEnd: 1804
  importance: 3
  hint: 川楚白莲教、天理教各支相继起事，历时九年、耗饷巨万，是“康乾盛世”后国力由盛转衰的标志；说明嘉道中衰的开端。
- id: opium-war
  type: event
  title: 鸦片战争
  era: qing
  dynasty: qing
  year: 1840
  yearEnd: 1842
  importance: 5
  hint: 虎门销烟后，英国以武力打开中国大门，清战败，签订中国近代第一个不平等条约《南京条约》，割香港、五口通商、协定关税；说明中国近代史的开端与“被动卷入世界”的转折。
- id: taiping-rebellion
  type: event
  title: 太平天国运动
  era: qing
  dynasty: qing
  year: 1851
  yearEnd: 1864
  importance: 5
  hint: 洪秀全以拜上帝教发动金田起义，建都天京，颁布《天朝田亩制度》，与清廷拉锯十四年，终为湘淮军所剿；说明这次农民战争的规模、纲领及其对清廷权力下移的影响。
- id: second-opium-war
  type: event
  title: 第二次鸦片战争
  era: qing
  dynasty: qing
  year: 1856
  yearEnd: 1860
  importance: 3
  hint: 英法联军北上，火烧圆明园、签订《天津条约》《北京条约》，开放口岸、划定租界；说明侵略加深与清廷对夷务态度的被迫转变。
- id: yangwu-movement
  type: event
  title: 洋务运动
  era: qing
  dynasty: qing
  year: 1861
  yearEnd: 1895
  importance: 5
  hint: 奕訢、曾国藩、李鸿章等以“自强求富”名义兴办近代军事工业与民用工业、创建海军（北洋水师），终因甲午战争失败而破产；说明其“师夷长技”的局限与评价。
- id: sino-japanese-war
  type: event
  title: 甲午中日战争
  era: qing
  dynasty: qing
  year: 1894
  yearEnd: 1895
  importance: 5
  hint: 朝鲜东学党引发中日冲突，平壤、黄海海战、旅顺威海相继失守，签订《马关条约》割台湾赔巨款；说明洋务运动失败与列强瓜分狂潮的开端。
- id: wuxu-reform
  type: event
  title: 戊戌变法
  era: qing
  dynasty: qing
  year: 1898
  importance: 5
  hint: 光绪帝与康有为、梁启超推行变法百日，因慈禧太后发动政变而失败，六君子被杀；说明变法内容、失败原因与“戊戌维新”的历史意义。
- id: boxer-rebellion
  type: event
  title: 义和团运动与八国联军
  era: qing
  dynasty: qing
  year: 1899
  yearEnd: 1901
  importance: 4
  hint: 山东义和团反帝、被清政府利用，八国联军攻入北京，签订《辛丑条约》；说明这场“扶清灭洋”民变与巨量赔款对社会心理的冲击。
- id: xinhai-revolution
  type: event
  title: 辛亥革命与清亡
  era: qing
  dynasty: qing
  year: 1911
  yearEnd: 1912
  importance: 5
  hint: 武昌起义、各省独立，1912年孙中山就任临时大总统、清帝溥仪退位，两千余年的帝制终结；说明辛亥革命的性质与中华民国的建立（边界事件可提到民国）。

# —— 人物 ——
- id: nurhaci
  type: person
  title: 努尔哈赤
  era: qing
  dynasty: qing
  year: 1559
  yearEnd: 1626
  importance: 4
  hint: 爱新觉罗·努尔哈赤，建州女真首领，统一女真、创建八旗制度并创满文，1616年建后金称汗；说明后金政权的奠基与他与明朝的辽东战争。
- id: huangtaiji
  type: person
  title: 皇太极
  era: qing
  dynasty: qing
  year: 1592
  yearEnd: 1643
  importance: 4
  hint: 清太宗，改族名满洲、国号大清，破明松锦，为入主中原奠基础；说明其在清代开国中的承继与改革。
- id: kangxi
  type: person
  title: 康熙帝
  era: qing
  dynasty: qing
  year: 1654
  yearEnd: 1722
  importance: 5
  hint: 名玄烨，庙号圣祖；八岁即位、除鳌拜、平三藩、收台湾、三征噶尔丹、签尼布楚条约，编纂《康熙字典》；说明其与“千古一帝”评价相关的功业与争议（外聘耶稣会士、宽仁笼络）。
- id: yongzheng
  type: person
  title: 雍正帝
  era: qing
  dynasty: qing
  year: 1678
  yearEnd: 1735
  importance: 4
  hint: 名胤禛，继位疑案（“传位十四子”），设军机处、摊丁入亩、养廉银与密折制，以严猛治国；说明其行政严密与继位争议的史学讨论。
- id: qianlong
  type: person
  title: 乾隆帝
  era: qing
  dynasty: qing
  year: 1711
  yearEnd: 1799
  importance: 4
  hint: 名弘历，缔造“康乾盛世”，十全武功、编纂《四库全书》亦焚书禁书，六下江南；说明盛世顶点的成就与其晚年（和珅、弛禁）所埋隐患。
- id: cao-xueqin
  type: person
  title: 曹雪芹
  era: qing
  dynasty: qing
  year: 1715
  yearEnd: 1763
  importance: 4
  hint: 名霑，江宁织造曹氏之后，著《红楼梦》（《石头记》）前八十回；“满纸荒唐言”的家族自况；说明中国古典小说巅峰及其文本流传问题（生年约1715，卒年有1763/1764两说）。
- id: he-shen
  type: person
  title: 和珅
  era: qing
  dynasty: qing
  year: 1750
  yearEnd: 1799
  importance: 3
  hint: 乾隆帝宠臣，权倾朝野、家产空前（“和珅跌倒，嘉庆吃饱”），乾隆崩后被赐死；说明乾隆晚年政治腐败与清代财政的缩影。
- id: lin-ze-xu
  type: person
  title: 林则徐
  era: qing
  dynasty: qing
  year: 1785
  yearEnd: 1850
  importance: 4
  hint: 字少穆，虎门销烟的钦差大臣，“开眼看世界”的第一人，译西报、译《四洲志》；说明其禁烟立场与近代屈辱中的正面形象。
- id: hong-xiuquan
  type: person
  title: 洪秀全
  era: qing
  dynasty: qing
  year: 1814
  yearEnd: 1864
  importance: 4
  hint: 太平天国天王，屡试不第受拜上帝教影响，金田起义建都天京；说明其宗教理想、内讧（天京事变）与太平天国的败亡。
- id: zeng-guofan
  type: person
  title: 曾国藩
  era: qing
  dynasty: qing
  year: 1811
  yearEnd: 1872
  importance: 4
  hint: 字涤生，湘军统帅，剿灭太平天国，倡办洋务，著《曾国藩家书》；说明其“中兴名臣”形象与理学经世的色彩。
- id: li-hongzhang
  type: person

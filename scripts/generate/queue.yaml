  title: 元末红巾军起义
  era: song-liao-jin-yuan
  dynasty: yuan
  year: 1351
  importance: 3
  hint: 元末黄河泛滥、钞法崩溃，韩山童刘福通以“明王出世”“石人一只眼”煽动，红巾军大起，朱元璋乘势而起；说明元亡与汉人反抗的进程。


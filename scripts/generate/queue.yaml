- id: shaoxing-heyi
  type: event
  title: 绍兴和议
  era: song-liao-jin-yuan
  dynasty: southern-song
  year: 1141
  yearEnd: 1142
  importance: 4
  hint: 南宋与金订立和约，称臣纳贡、岁贡银绢二十五万两匹，割唐邓二州，宋金以淮河至大散关为界；说明其代价与后续“海陵南侵”之伏笔。
- id: longxing-heyi
  type: event
  title: 隆兴和议
  era: song-liao-jin-yuan
  dynasty: southern-song
  year: 1164
  yearEnd: 1165
  importance: 3

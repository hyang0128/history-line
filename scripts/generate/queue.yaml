  era: song-liao-jin-yuan
  year: 1030
  yearEnd: 1200
  importance: 4
  hint: 北宋周敦颐、张载、二程创立，南宋朱熹集大成的儒家新形态，以“理”为宇宙本体，提倡格物致知、存天理灭人欲；说明其与北宋五子、朱陆之争及元明清官学地位。
- id: jiaozi-paper-money

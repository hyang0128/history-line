# ================================================================
# 模型登记表 · A1
#
# provider: openai-compatible | anthropic | mock
#   各模型对应的 API 协议。换模型只改本文件，不改代码（PLAN §6.7）。
# apiKeyEnv: 从环境变量读取 key，key 不入库。见 .env.example。
#
# 单价为【示例值】，须在 docs/model-eval.md 实测后按各家官网当前价核对更新，
# 不要凭记忆写死。币种 currency: cny | usd，统一按 usdCnyRate 换算成人民币统计。
# ================================================================

# 各任务档位 → 具体模型（queue.yaml 条目里的 model / tier 可覆盖）
defaults:
  tier: cheap
  model: deepseek-v4-flash   # 默认走规划会话同款通道（Ark）

tiers:
  cheap: deepseek-v4-flash   # 事件/人物起草，体量最大（占成本大头）
  medium: deepseek-v4-flash  # 批注块、交叉复核（暂与 cheap 同款，评测后替换）
  high: claude-sonnet-5      # importance=5 或审核打回重写

# importance → 档位。默认空表，避免意外升档花钱；
# 经 §6.7 复查后确认，打开下面这行即可让 5 级节点走高价档。
tierByImportance: {}
# tierByImportance:
#   5: high

# 统一换汇（示例值 ~7.2，实测后更新）
usdCnyRate: 7.2

# 单次运行预估费用上限（元），超出需 --yes 确认
costThresholdYuan: 20

# 无历史统计时，每个节点起草的平均 token 估算（用于 --dry-run / 费用提示）
estimateTokens:
  input: 2600
  output: 1500

models:
  deepseek-v4-flash:
    provider: anthropic
    baseURL: https://ark.cn-beijing.volces.com/api/coding
    apiKeyEnv: ANTHROPIC_AUTH_TOKEN
    auth: bearer
    model: deepseek-v4-flash[1M]
    inputPerM: 0              # 示例 0：Ark 计费未核对，跑一两次后按账单补真实单价
    outputPerM: 0
    currency: cny
    context: 1000000
    note: 规划会话同款（Ark Anthropic 兼容 · Bearer）；token 走 harness 的 ANTHROPIC_AUTH_TOKEN
  deepseek-chat:
    provider: openai-compatible
    baseURL: https://api.deepseek.com
    apiKeyEnv: DEEPSEEK_API_KEY
    model: deepseek-chat
    inputPerM: 2              # 元/百万 token（示例，待核对）
    outputPerM: 8
    currency: cny
    context: 65536
    note: 低价默认档（DeepSeek Chat）
  glm-4-flash:
    provider: openai-compatible
    baseURL: https://open.bigmodel.cn/api/paas/v4
    apiKeyEnv: GLM_API_KEY
    model: glm-4-flash
    inputPerM: 0              #（历史免费额度的示例值，待核对）
    outputPerM: 0
    currency: cny
    context: 131072
    note: GLM 4 Flash，评测候选
  moonshot-v1-32k:
    provider: openai-compatible
    baseURL: https://api.moonshot.cn/v1
    apiKeyEnv: MOONSHOT_API_KEY
    model: moonshot-v1-32k
    inputPerM: 12
    outputPerM: 12
    currency: cny
    context: 32768
    note: Kimi，中价档
  deepseek-reasoner:
    provider: openai-compatible
    baseURL: https://api.deepseek.com
    apiKeyEnv: DEEPSEEK_API_KEY
    model: deepseek-reasoner
    inputPerM: 5
    outputPerM: 20
    currency: cny
    context: 65536
    note: 推理档（可选，不设 response_format）
  claude-sonnet-5:
    provider: anthropic
    model: claude-sonnet-5
    apiKeyEnv: ANTHROPIC_API_KEY
    inputPerM: 3.5            # USD / 百万 token（示例，待核对）
    outputPerM: 15.0
    currency: usd
    context: 200000
    note: 高价档，仅少数高价值节点用（Claude）
  mock:
    provider: mock
    model: mock
    inputPerM: 0
    outputPerM: 0
    currency: cny
    note: 仅用于管线自检（--model mock），不产生真实调用

# 多模型评测（scripts/generate/eval.ts）的候选模型
eval:
  models: [deepseek-chat, glm-4-flash, moonshot-v1-32k, claude-sonnet-5]